# Netlify: статический сайт без сборки, публикуется корень репозитория.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# index.html и конфиг всегда свежие, чтобы обновления доходили до учеников сразу
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/supabase-config.js"
  [headers.values]
    Cache-Control = "no-cache"
